name: .NET next (canary)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Build, test and publish on .NET 11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Point this runner's checkout at .NET 11
        run: |
          sed -i 's|<TargetFramework>net10.0</TargetFramework>|<TargetFramework>net11.0</TargetFramework>|' Directory.Build.props
          sed -i 's|ARG DOTNET_VERSION=10.0|ARG DOTNET_VERSION=11.0-preview|' Containerfile
          printf '{\n  "test": {\n    "runner": "Microsoft.Testing.Platform"\n  }\n}\n' > global.json
      - run: bash scripts/ci.sh --skip-export
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canary-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
