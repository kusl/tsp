name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: bash scripts/ci.sh --skip-publish --skip-container --skip-export

  publish:
    name: Publish ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
          - rid: win-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: bash scripts/publish.sh ${{ matrix.rid }}
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: tsp-${{ matrix.rid }}
          path: artifacts/release/tsp-*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: tsp-*
          path: artifacts/release
          merge-multiple: true
      - id: version
        run: echo "version=$(bash scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - run: bash scripts/checksums.sh artifacts/release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: tsp ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/release/tsp-*
            artifacts/release/SHA256SUMS
